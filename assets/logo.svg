<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="corpus-forge logo">
  <title>corpus-forge</title>
  <desc>Square logo mark: stylized anvil with an ember halo, on a warm-neutral background.</desc>

  <defs>
    <radialGradient id="bgl" cx="0.5" cy="0.45" r="0.65">
      <stop offset="0" stop-color="#fff7e8"/>
      <stop offset="1" stop-color="#e7dec8"/>
    </radialGradient>
    <linearGradient id="anvill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a2f3a"/>
      <stop offset="1" stop-color="#0e1117"/>
    </linearGradient>
    <linearGradient id="emberl" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff8a3d"/>
      <stop offset="1" stop-color="#b83205"/>
    </linearGradient>
    <filter id="glowl" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="512" height="512" rx="80" ry="80" fill="url(#bgl)"/>

  <ellipse cx="256" cy="290" rx="200" ry="60" fill="url(#emberl)" opacity="0.28" filter="url(#glowl)"/>

  <g transform="translate(96 168)">
    <!-- anvil body -->
    <path d="M40 110 L280 110 L260 60 L100 60 Q70 60 60 80 Z" fill="url(#anvill)"/>
    <!-- waist -->
    <path d="M120 110 L120 160 Q120 175 110 180 L210 180 Q200 175 200 160 L200 110 Z" fill="#1a1d24"/>
    <!-- base -->
    <rect x="80" y="180" width="160" height="22" rx="4" fill="#0e1117"/>
    <!-- horn -->
    <path d="M280 90 Q330 80 320 110 L260 110 Z" fill="#161a22"/>
  </g>

  <g fill="url(#emberl)" opacity="0.95">
    <circle cx="240" cy="130" r="6"/>
    <circle cx="290" cy="150" r="4"/>
    <circle cx="200" cy="148" r="4"/>
    <circle cx="320" cy="110" r="5"/>
    <circle cx="170" cy="166" r="3"/>
  </g>

  <text x="256" y="448" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, sans-serif" font-size="36" font-weight="800" fill="#1a1d24" letter-spacing="-0.5">corpus-forge</text>
</svg>

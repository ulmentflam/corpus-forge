<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 400" width="1600" height="400" role="img" aria-label="corpus-forge — forge a HuggingFace-format training corpus from your notes and chat history">
  <title>corpus-forge</title>
  <desc>Forge-themed banner: ingest sources flow into a central forge/anvil, pluggable embedders surround it, polished HuggingFace dataset emerges to the right.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a1220"/>
      <stop offset="0.5" stop-color="#0f1a2e"/>
      <stop offset="1" stop-color="#070d18"/>
    </linearGradient>
    <linearGradient id="ember" x1="0.2" y1="0" x2="0.8" y2="1">
      <stop offset="0" stop-color="#ffb547"/>
      <stop offset="0.5" stop-color="#ff6f3c"/>
      <stop offset="1" stop-color="#b03020"/>
    </linearGradient>
    <linearGradient id="hf-panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffce4a"/>
      <stop offset="1" stop-color="#e89a2c"/>
    </linearGradient>
    <linearGradient id="anvil" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#3a3a3a"/>
      <stop offset="1" stop-color="#1a1a1a"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1d2638" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#131b29" stop-opacity="0.9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffb547" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffb547" stop-opacity="0"/>
    </radialGradient>
    <marker id="arrowhead" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#d4af6d"/>
    </marker>
  </defs>

  <rect width="1600" height="400" fill="url(#bg)"/>

  <g stroke="#1c2740" stroke-width="1" opacity="0.4">
    <line x1="0" y1="80" x2="1600" y2="80"/>
    <line x1="0" y1="160" x2="1600" y2="160"/>
    <line x1="0" y1="240" x2="1600" y2="240"/>
    <line x1="0" y1="320" x2="1600" y2="320"/>
    <line x1="200" y1="0" x2="200" y2="400"/>
    <line x1="500" y1="0" x2="500" y2="400"/>
    <line x1="800" y1="0" x2="800" y2="400"/>
    <line x1="1100" y1="0" x2="1100" y2="400"/>
    <line x1="1400" y1="0" x2="1400" y2="400"/>
  </g>

  <!-- LEFT: ingest sources -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-weight="600">
    <rect x="40" y="50" width="320" height="60" rx="10" fill="url(#panel)" stroke="#3a4664" stroke-width="1.5"/>
    <rect x="56" y="62" width="36" height="36" rx="6" fill="#8b5cf6" opacity="0.85"/>
    <text x="68" y="89" font-size="22" fill="#fff" font-weight="700">M</text>
    <text x="108" y="80" font-size="22" fill="#e8e8e8" font-weight="700">Markdown Vaults</text>
    <text x="108" y="100" font-size="13" fill="#9ca7c0" font-family="ui-monospace, 'SF Mono', Menlo, monospace">notes · frontmatter · Obsidian</text>

    <rect x="40" y="140" width="320" height="60" rx="10" fill="url(#panel)" stroke="#3a4664" stroke-width="1.5"/>
    <circle cx="74" cy="170" r="20" fill="#22d3ee" opacity="0.85"/>
    <text x="63" y="178" font-size="20" fill="#0a1220" font-weight="700">&gt;_</text>
    <text x="108" y="170" font-size="22" fill="#e8e8e8" font-weight="700">Code Chats</text>
    <text x="108" y="190" font-size="13" fill="#9ca7c0" font-family="ui-monospace, 'SF Mono', Menlo, monospace">Claude · OpenCode · Gemini · Codex</text>

    <rect x="40" y="230" width="320" height="60" rx="10" fill="url(#panel)" stroke="#3a4664" stroke-width="1.5"/>
    <rect x="56" y="244" width="32" height="36" rx="3" fill="#fbbf24" opacity="0.85"/>
    <text x="60" y="258" font-size="9" fill="#0a1220" font-weight="700">{tok}</text>
    <text x="60" y="270" font-size="9" fill="#0a1220" font-weight="700">[chk]</text>
    <text x="60" y="280" font-size="9" fill="#0a1220" font-weight="700">.md</text>
    <text x="108" y="260" font-size="22" fill="#e8e8e8" font-weight="700">Ingest Sources</text>
    <text x="108" y="280" font-size="13" fill="#9ca7c0" font-family="ui-monospace, 'SF Mono', Menlo, monospace">9 plugins · sqlite-vec · pgvector</text>
  </g>

  <g stroke="#d4af6d" stroke-width="2" fill="none" opacity="0.55">
    <path d="M 365 80 Q 470 80 580 170" stroke-dasharray="5 4"/>
    <path d="M 365 170 L 580 170" stroke-dasharray="5 4"/>
    <path d="M 365 260 Q 470 260 580 170" stroke-dasharray="5 4"/>
  </g>

  <!-- CENTER: forge + anvil -->
  <g transform="translate(800, 220)">
    <ellipse cx="0" cy="-30" rx="180" ry="100" fill="url(#glow)"/>
    <rect x="-100" y="40" width="200" height="30" rx="4" fill="url(#anvil)"/>
    <rect x="-80" y="0" width="160" height="40" fill="url(#anvil)"/>
    <path d="M -80 0 L -125 -10 L -120 22 L -80 22 Z" fill="url(#anvil)"/>
    <rect x="-95" y="-15" width="190" height="20" rx="2" fill="#2a2a2a" stroke="#444" stroke-width="1"/>
    <rect x="-90" y="-12" width="180" height="3" rx="1.5" fill="url(#ember)"/>
    <g fill="#ffb547">
      <circle cx="-30" cy="-25" r="2.5"/>
      <circle cx="10" cy="-35" r="3"/>
      <circle cx="40" cy="-28" r="2"/>
      <circle cx="-10" cy="-45" r="2"/>
      <circle cx="60" cy="-40" r="2.5"/>
      <circle cx="-50" cy="-50" r="1.5"/>
    </g>
  </g>

  <text x="800" y="78" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="28" font-weight="700" fill="#d4af6d">Smart Vectorization · Chunking · Embedding</text>
  <text x="800" y="103" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#7a8aa8">content-hashed chunks · reusable embeddings · hybrid retrieval</text>

  <g font-family="-apple-system, system-ui, sans-serif">
    <text x="800" y="160" text-anchor="middle" fill="#d4af6d" font-weight="700" font-size="16">Pluggable Embedders</text>
    <text x="800" y="183" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="14" fill="#9ca7c0">sentence-transformers · OpenAI · Ollama · vLLM</text>
  </g>

  <g stroke="#d4af6d" stroke-width="2.5" fill="none" opacity="0.6">
    <path d="M 920 200 Q 1050 170 1180 110" stroke-dasharray="5 4" marker-end="url(#arrowhead)"/>
  </g>

  <!-- RIGHT: HuggingFace export panel -->
  <g>
    <rect x="1190" y="50" width="380" height="120" rx="14" fill="url(#hf-panel)" stroke="#9a6a14" stroke-width="2"/>
    <text x="1380" y="90" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="22" font-weight="800" fill="#0a1220">🤗 HuggingFace Format</text>
    <text x="1380" y="116" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="18" font-weight="700" fill="#0a1220">Training Corpus</text>
    <text x="1380" y="142" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#3a2810">corpus_text_export · corpus_chat_export</text>
    <text x="1380" y="160" text-anchor="middle" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#3a2810">parquet · JSONL · arrow</text>
  </g>

  <g>
    <rect x="1190" y="195" width="380" height="170" rx="10" fill="url(#panel)" stroke="#3a4664" stroke-width="1.5"/>
    <text x="1210" y="222" font-family="-apple-system, system-ui, sans-serif" font-size="16" font-weight="700" fill="#d4af6d">Advanced Capabilities</text>
    <g font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="12" fill="#9ca7c0">
      <text x="1210" y="248"><tspan fill="#ffb547" font-weight="700">▸</tspan> Backfill workflow (new embedders)</text>
      <text x="1210" y="268"><tspan fill="#ffb547" font-weight="700">▸</tspan> Daemon mode · file watching · incremental</text>
      <text x="1210" y="288"><tspan fill="#ffb547" font-weight="700">▸</tspan> Retrieval eval (NDCG · MRR · Recall)</text>
      <text x="1210" y="308"><tspan fill="#ffb547" font-weight="700">▸</tspan> MCP stdio server · 15 tools</text>
      <text x="1210" y="328"><tspan fill="#ffb547" font-weight="700">▸</tspan> Chat templates (ChatML · Llama-3 · HF)</text>
      <text x="1210" y="348"><tspan fill="#ffb547" font-weight="700">▸</tspan> Self-distillation feedback loop</text>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <text x="40" y="365" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', system-ui, sans-serif" font-size="42" font-weight="800" fill="#e8e8e8">corpus-forge</text>
  <text x="320" y="365" font-family="ui-monospace, 'SF Mono', Menlo, monospace" font-size="18" fill="#d4af6d" font-weight="700">&gt;_</text>
  <text x="40" y="390" font-family="-apple-system, system-ui, sans-serif" font-size="14" fill="#9ca7c0">forge a HuggingFace-format training corpus from your notes &amp; chat history</text>
</svg>

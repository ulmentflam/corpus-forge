name: Nightly

# CI-2: cron-driven nightly that runs the FULL matrix (3 OS × 3 Python) plus
# integration + fuzz under the ``nightly`` hypothesis profile (10× examples
# vs the ``ci`` profile).  Posts results to the workflow run summary; we
# can wire a Linear/GitHub-issue comment later if needed.

on:
  schedule:
    # 07:00 UTC = 00:00 PT / 03:00 ET — quietest window for runner pool.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: nightly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false  # don't cancel a long nightly mid-run

permissions:
  contents: read

env:
  HYPOTHESIS_PROFILE: nightly
  FORCE_COLOR: "1"
  UV_NO_PROGRESS: "1"

defaults:
  run:
    shell: bash

jobs:
  # ── Job 1: unit + fuzz across the 2-OS × 3-Python matrix ─────────────────
  # Windows was dropped from the v0.1.0b1 beta matrix (see ci.yml); nightly
  # mirrors the same Linux + macOS shape.  TODO(post-beta): re-add windows.
  unit-and-fuzz:
    name: Unit+Fuzz (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14]
        python-version: ["3.11", "3.12", "3.13"]
        include:
          - os: macos-14
            python-version: "3.13"
            allow-failure: true
    continue-on-error: ${{ matrix.allow-failure == true }}
    env:
      HYPOTHESIS_PROFILE: nightly
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}

      - name: Restore Hugging Face cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}

      - name: Unit tests
        run: make test-unit

      - name: Fuzz tests (nightly profile = 10× examples)
        run: make test-fuzz

      - name: Smoke tests
        run: make test-smoke

  # ── Job 2: integration across Linux + macOS (matches integration.yml axis) ─
  integration-linux:
    name: Nightly integration (ubuntu-22.04 / py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corpus_forge_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d corpus_forge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Integration tests
        run: make test-integration

  integration-macos:
    name: Nightly integration (macos-14 / py${{ matrix.python-version }})
    runs-on: macos-14
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker (Colima-backed)
        # See integration.yml comment: brew + Colima is the stable
        # path for macos-arm64 (crazy-max action 404s on docker CDN).
        run: |
          brew install --quiet colima docker
          # See integration.yml: Lima 2.1.1 panics under --vm-type=qemu
          # on macos-14 runners; VZ + virtiofs is the supported path now
          # that Colima 0.10.1 ships a fixed raw-disk converter.
          colima start --cpu 3 --memory 5 --disk 14 \
            --vm-type=vz --mount-type=virtiofs
          docker info

      - name: Pre-pull pgvector image
        run: docker pull pgvector/pgvector:pg16

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Integration tests
        run: make test-integration

  # ── Job 3: summary — append a run-level note for easy review ─────────────
  summary:
    name: Nightly summary
    runs-on: ubuntu-latest
    needs: [unit-and-fuzz, integration-linux, integration-macos]
    if: always()
    steps:
      - name: Post summary
        run: |
          {
            echo "# Nightly run summary"
            echo ""
            echo "- Trigger: ${{ github.event_name }}"
            echo "- Ref: ${{ github.ref }}"
            echo "- Hypothesis profile: nightly (10× examples vs ci)"
            echo "- Result: unit=${{ needs.unit-and-fuzz.result }}, integration-linux=${{ needs.integration-linux.result }}, integration-macos=${{ needs.integration-macos.result }}"
          } >> "$GITHUB_STEP_SUMMARY"

name: Integration

# CI-2: dedicated workflow for the testcontainers-Postgres integration suite.
# Linux + macOS only — Windows has no Docker daemon on GitHub-hosted runners
# (the CI workflow's Windows matrix cells set CI_NO_DOCKER=1 to skip).
#
# Linux runners use a Postgres + pgvector `services:` container with a
# pg_isready healthcheck.  testcontainers' Python client picks up the
# running service when DSN env vars are passed; for tests that ALSO spawn
# their own testcontainers Postgres (most of them today), having the
# service-managed image already pre-pulled keeps the per-test container
# spin-up snappy.
#
# macOS runners install Docker via Colima (crazy-max/ghaction-setup-docker)
# so testcontainers can spin up postgres-pgvector on-demand.
#
# 3.13 is intentionally dropped from this workflow's matrix until
# sentence-transformers + torch ship stable wheels on python 3.13 for
# macos-arm64 (revisit weekly).
# TODO: re-add 3.13 to integration.yml matrix when sentence-transformers
# wheels stable on 3.13.

on:
  pull_request:
    paths:
      - "corpus_forge/**"
      - "tests/integration/**"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/integration.yml"
      - ".github/actions/setup-uv/**"
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HYPOTHESIS_PROFILE: ci
  FORCE_COLOR: "1"
  UV_NO_PROGRESS: "1"

defaults:
  run:
    shell: bash

jobs:
  integration-linux:
    name: Integration (ubuntu-22.04 / py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corpus_forge_ci
        ports:
          - 5432:5432
        # pg_isready is the canonical liveness probe for a running cluster;
        # testcontainers' Python client also waits on this, but having a
        # service-level healthcheck means GitHub starts our steps only once
        # the container is genuinely accepting connections.
        options: >-
          --health-cmd "pg_isready -U postgres -d corpus_forge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
          # Integration suite loads sentence-transformers / faster-whisper
          # via the conftest probes; warm the cache (or restore it) here
          # so the test step can run under HF_HUB_OFFLINE=1.
          warm-hf-cache: "true"

      - name: Restore uv cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-
            uv-${{ runner.os }}-

      - name: Integration tests (testcontainers Postgres)
        env:
          # Cache pre-warmed in setup-uv on miss; tests run offline so
          # Hub 429 storms (the historical flake source on this job)
          # surface as a clear "model not in cache" error instead.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: make test-integration

  # macOS integration was dropped from the v0.1.0b1 matrix.  GitHub-hosted
  # macos-14 runners ship Lima 2.1.1, which fatals at "creating and
  # starting" during a raw→raw datadisk "conversion" (a Lima
  # additionalDisks bug we can't fix from here) on the VZ driver, and
  # panics inside qemu_driver.go:382 on the QEMU driver.  We tried three
  # Colima/VM-type combinations this milestone before accepting that the
  # bug is upstream.  Linux integration (testcontainers Postgres on
  # ubuntu-22.04) is the canonical cross-OS evidence path; macOS
  # integration on CI has never been load-bearing — local macOS dev
  # works fine via Docker Desktop.
  # TODO(post-beta): re-add a macOS integration cell once Lima ships a
  # fixed additionalDisks path (track lima-vm/lima releases ≥ 2.2.x).

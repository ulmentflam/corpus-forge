name: Integration

# CI-2: dedicated workflow for the testcontainers-Postgres integration suite.
# Linux + macOS only — Windows has no Docker daemon on GitHub-hosted runners
# (the CI workflow's Windows matrix cells set CI_NO_DOCKER=1 to skip).
#
# Linux runners use a Postgres + pgvector `services:` container with a
# pg_isready healthcheck.  testcontainers' Python client picks up the
# running service when DSN env vars are passed; for tests that ALSO spawn
# their own testcontainers Postgres (most of them today), having the
# service-managed image already pre-pulled keeps the per-test container
# spin-up snappy.
#
# macOS runners install Docker via Colima (crazy-max/ghaction-setup-docker)
# so testcontainers can spin up postgres-pgvector on-demand.
#
# 3.13 is intentionally dropped from this workflow's matrix until
# sentence-transformers + torch ship stable wheels on python 3.13 for
# macos-arm64 (revisit weekly).
# TODO: re-add 3.13 to integration.yml matrix when sentence-transformers
# wheels stable on 3.13.

on:
  pull_request:
    paths:
      - "corpus_forge/**"
      - "tests/integration/**"
      - "tests/conftest.py"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/integration.yml"
      - ".github/actions/setup-uv/**"
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

concurrency:
  group: integration-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  HYPOTHESIS_PROFILE: ci
  FORCE_COLOR: "1"
  UV_NO_PROGRESS: "1"

defaults:
  run:
    shell: bash

jobs:
  integration-linux:
    name: Integration (ubuntu-22.04 / py${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04]
        python-version: ["3.11", "3.12"]
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: corpus_forge_ci
        ports:
          - 5432:5432
        # pg_isready is the canonical liveness probe for a running cluster;
        # testcontainers' Python client also waits on this, but having a
        # service-level healthcheck means GitHub starts our steps only once
        # the container is genuinely accepting connections.
        options: >-
          --health-cmd "pg_isready -U postgres -d corpus_forge_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-
            uv-${{ runner.os }}-

      - name: Restore Hugging Face cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Integration tests (testcontainers Postgres)
        run: make test-integration

  integration-macos:
    name: Integration (macos-14 / py${{ matrix.python-version }})
    runs-on: macos-14
    timeout-minutes: 35
    # TODO(post-beta): un-soften this gate once GitHub-hosted macos-14
    # runners can boot Colima reliably.  We currently see Lima 2.1.1
    # crash at "creating and starting" on BOTH VM drivers:
    #   * vz:   immediate exit during raw→raw datadisk "conversion"
    #            (looks like a lima additionalDisks bug)
    #   * qemu: hostagent panic in qemu_driver.go:382 on macos-arm64
    # Linux integration (testcontainers Postgres) is the canonical
    # cross-OS evidence path for this milestone; macOS Docker on CI
    # has never been load-bearing.  Tracked: see TODO above.
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14]
        python-version: ["3.11", "3.12"]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker (Colima-backed) on macOS runner
        # GitHub-hosted macos-14 has no Docker pre-installed. We install
        # Colima + docker CLI directly via brew rather than
        # crazy-max/ghaction-setup-docker@v3, because that action pulls
        # the latest Docker static binary from download.docker.com and
        # frequently 404s on macos-arm64 when a new docker version
        # release ships ahead of the CDN. Testcontainers picks up the
        # docker.sock that Colima exposes.
        run: |
          brew install --quiet colima docker
          # macos-14 runner is arm64 + macOS 14, so VZ + virtiofs is the
          # supported Lima path. We previously routed via --vm-type=qemu
          # to dodge a Colima 0.9 raw-disk-converter crash, but on the
          # current runner Lima 2.1.1 panics inside qemu_driver.go on
          # boot, and Colima 0.10.1 fixed the VZ disk-converter issue.
          colima start --cpu 3 --memory 5 --disk 14 \
            --vm-type=vz --mount-type=virtiofs
          docker info

      - name: Pre-pull pgvector image
        # Pre-pull so the first testcontainers spin-up doesn't add cold-pull
        # latency to a test's clock budget.
        run: docker pull pgvector/pgvector:pg16

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}

      - name: Restore uv cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-
            uv-${{ runner.os }}-

      - name: Restore Hugging Face cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
          restore-keys: |
            hf-${{ runner.os }}-

      - name: Integration tests (testcontainers Postgres)
        run: make test-integration

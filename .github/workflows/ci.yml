name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# Cancel any in-flight CI run for the same ref when a new commit lands.
# Saves matrix minutes and stops stale lint runs from masking real signal.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Default to least-privilege; release.yml (later phase) re-grants
# `contents: write` for tag uploads.
permissions:
  contents: read

env:
  # Force CI hypothesis profile across both jobs. Local devs keep `dev`
  # by default (see tests/fuzz/profiles.py for the resolution rule).
  HYPOTHESIS_PROFILE: ci
  # Color output even when tee'd through GitHub's log renderer.
  FORCE_COLOR: "1"
  # Make pip / uv quieter on success; full output on failure is still visible.
  UV_NO_PROGRESS: "1"

# Workflows that invoke `make <target>` must use a POSIX shell on every
# matrix cell — Windows runners default to PowerShell otherwise, which
# breaks `make` chains and unset $HOME-style escapes.
defaults:
  run:
    shell: bash

jobs:
  # ── Job 0: actionlint — gate the matrix on shell-syntax / workflow-shape ─
  # Runs first and the matrix depends on it. If actionlint flags shellcheck
  # warnings or invalid `uses:` references, we stop before burning matrix
  # minutes.  Uses raven-actions/actionlint (no extra binary install needed).
  actionlint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: actionlint
        uses: raven-actions/actionlint@v2
        with:
          # Fail the job on any error; pin shellcheck to its bundled version
          # so we don't drift across reruns.
          fail-on-error: true

  # ── Job 1: static-analysis gauntlet ─────────────────────────────────────
  # Runs once on the lowest supported Python; the matrix axis is only
  # needed for the test job (the analysers are version-agnostic).
  quality:
    name: Lint + format + typecheck
    runs-on: ubuntu-22.04
    timeout-minutes: 10
    needs: [actionlint]
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv
        with:
          python-version: "3.11"

      - name: ruff format --check
        run: make format-check

      - name: ruff check
        run: make lint

      - name: pyrefly check
        run: make typecheck

  # ── Job 2: unit + smoke + fuzz across the 3-OS × 3-Python matrix ─────────
  # Phase I-02 restored windows-2022 to the matrix after I-01 closed the
  # four real portability blockers (cp1252 encoding on the secrets file,
  # ``os.uname`` in one test, two unmarked symlink tests, iCloud-on-
  # Windows detection). Integration tests are NOT run here — see
  # integration.yml (Linux only; testcontainers needs a Docker daemon
  # that's not available on GitHub-hosted Windows runners).
  #
  # Windows cells set ``CI_NO_DOCKER=1`` so any test carrying the
  # ``integration`` keyword skips with a clear reason at collection time
  # (see tests/conftest.py::pytest_collection_modifyitems).
  test:
    name: Tests (${{ matrix.os }} / py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    needs: [actionlint]
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
        python-version: ["3.11", "3.12", "3.13"]
        # macOS-arm64 + py3.13 stays soft-fail until sentence-transformers
        # / torch wheels stabilize; revisit weekly.
        # windows-2022 is now required after Phase I-01 closed the
        # portability blockers — three green CI runs on this PR.
        include:
          - os: macos-14
            python-version: "3.13"
            allow-failure: true
    continue-on-error: ${{ matrix.allow-failure == true }}
    env:
      # Skip the Docker-backed integration suite at collection time.
      # Plumbed through tests/conftest.py — see pytest_collection_modifyitems.
      # Windows runners have a Docker CLI without a daemon, which would
      # otherwise spuriously slip past _docker_available().
      CI_NO_DOCKER: ${{ matrix.os == 'windows-2022' && '1' || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup uv + Python
        uses: ./.github/actions/setup-uv
        with:
          python-version: ${{ matrix.python-version }}
          # Re-key on .github/ci-models.txt and warm on cache miss.
          # See the action for the full rationale.
          warm-hf-cache: "true"
          # Authenticated Hub requests dodge the anonymous shared-runner-IP
          # rate limit on the cold (cache-miss) warm path — issue #90.
          # Empty when the secret isn't configured / on fork PRs: safe,
          # huggingface_hub treats an empty token as anonymous.
          hf-token: ${{ secrets.HF_TOKEN }}

      - name: Restore uv cache
        uses: actions/cache@v5
        with:
          path: ~/.cache/uv
          key: uv-${{ runner.os }}-py${{ matrix.python-version }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}
          restore-keys: |
            uv-${{ runner.os }}-py${{ matrix.python-version }}-
            uv-${{ runner.os }}-

      - name: Unit tests (parallel, timeout-gated, coverage-gated)
        env:
          # Cache is warmed in setup-uv on miss; tests must run
          # offline so a Hub 429 storm can't quietly flake them.
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: make test-unit

      - name: Fuzz tests (hypothesis profile=ci)
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: make test-fuzz

      - name: Smoke tests
        env:
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: make test-smoke

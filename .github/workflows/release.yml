name: release

# Tag-triggered release pipeline. Beta / RC tags are auto-marked as
# `prerelease` via the `contains(github.ref, 'b' | 'rc')` expression in
# the publish job. See CONTRIBUTING.md §Releasing for the maintainer
# workflow.

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Re-run the PR gate against the exact tag SHA. If matrix CI fails,
  # the release is aborted before any artifact is produced.
  gate:
    uses: ./.github/workflows/ci.yml

  build:
    needs: gate
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up uv + Python
        uses: ./.github/actions/setup-uv

      - name: Build wheel + sdist
        run: uv build --out-dir dist

      - name: Generate SHA256SUMS
        run: |
          cd dist
          # shellcheck disable=SC2035  # dist/ contains only wheel + sdist; no dash-prefixed names possible
          sha256sum -- * > SHA256SUMS
          cat SHA256SUMS

      - name: Upload dist artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist-${{ github.ref_name }}
          path: dist/
          if-no-files-found: error
          retention-days: 30

  # PyPI Trusted Publishing via OIDC. No token in CI; PyPI verifies the
  # GitHub-issued ID token against a pre-registered publisher on the
  # project page (Account settings → Publishing → "Pending publishers"
  # for the first ever upload, then the publisher carries over).
  #
  # One-time PyPI setup (does NOT block tagging; only blocks this job
  # actually uploading):
  #   1. Visit https://pypi.org/manage/account/publishing/ logged in as
  #      the maintainer.
  #   2. "Add a new pending publisher" with:
  #        PyPI Project Name : corpus-forge
  #        Owner             : ulmentflam
  #        Repository name   : corpus-forge
  #        Workflow filename : release.yml
  #        Environment name  : pypi
  #   3. After the first successful upload, PyPI promotes this from
  #      "pending" to "active" and stops requiring it to be re-added.
  #
  # One-time GitHub setup:
  #   gh api -X PUT \
  #     "/repos/ulmentflam/corpus-forge/environments/pypi" \
  #     -f wait_timer=0 \
  #     -F reviewers='[]'
  # (Optional: add a required-reviewer to make uploads manual-approve.)
  pypi-publish:
    name: Publish to PyPI (Trusted Publishing)
    needs: build
    runs-on: ubuntu-22.04
    environment:
      name: pypi
      url: https://pypi.org/project/corpus-forge/
    permissions:
      id-token: write  # for OIDC; do NOT add contents:write here.
    steps:
      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Drop non-distribution files
        # The build job's SHA256SUMS lives next to dist/*.whl|*.tar.gz;
        # pypa/gh-action-pypi-publish runs `twine check` and would reject
        # SHA256SUMS as an unknown distribution. Strip before upload.
        run: rm -f dist/SHA256SUMS

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          # `skip-existing: false` (default) — if you accidentally re-fire
          # the workflow against the same tag, PyPI will reject the
          # duplicate upload and the job fails loudly. That's the right
          # default; flip to true only if you're deliberately repacking.
          print-hash: true
          verbose: true

  publish:
    needs: [build, pypi-publish]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download dist artifact
        uses: actions/download-artifact@v8
        with:
          name: dist-${{ github.ref_name }}
          path: dist/

      - name: Render changelog snippet
        id: changelog
        # v3's Docker image is on Debian buster which moved to archive.debian.org;
        # apt-get update inside the action's image 404s now.  v4 ships a newer base.
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: CHANGELOG_RELEASE.md

      - name: Create GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          prerelease: ${{ contains(github.ref, 'b') || contains(github.ref, 'rc') }}
          generate_release_notes: true
          body_path: CHANGELOG_RELEASE.md
          fail_on_unmatched_files: true
          token: ${{ secrets.GITHUB_TOKEN }}

  # Sync the Homebrew formula into ulmentflam/homebrew-tap so that
  # `brew install ulmentflam/tap/corpus-forge` always resolves to the
  # latest release. Runs AFTER `publish` so the source-tarball URL is
  # stable and the sha256 is reproducible.
  #
  # If the bump fails (missing secret, network blip, tap-side conflict)
  # the GH release + PyPI upload are already done — `continue-on-error`
  # keeps the workflow green and the maintainer can re-run this job in
  # isolation or fall back to the manual recipe in CONTRIBUTING.md
  # §Releasing → "Homebrew tap sync".
  #
  # One-time setup:
  #   1. Create a fine-grained PAT at
  #      https://github.com/settings/personal-access-tokens/new with:
  #        Resource owner    : ulmentflam
  #        Repository access : Only select repositories → homebrew-tap
  #        Permissions       : Repository → Contents: Read and write
  #   2. Store as a repo secret on ulmentflam/corpus-forge:
  #        gh secret set HOMEBREW_TAP_TOKEN < token.txt
  brew-bump:
    name: Bump Homebrew tap formula
    needs: publish
    runs-on: ubuntu-22.04
    continue-on-error: true  # GH release is already published; keep CI green.
    steps:
      - name: Checkout corpus-forge (formula scaffold)
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          path: corpus-forge

      - name: Checkout homebrew-tap
        uses: actions/checkout@v7
        with:
          repository: ulmentflam/homebrew-tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          path: homebrew-tap

      - name: Compute source tarball sha256
        id: meta
        run: |
          set -euo pipefail
          TAG="${GITHUB_REF_NAME}"
          URL="https://github.com/${GITHUB_REPOSITORY}/archive/refs/tags/${TAG}.tar.gz"
          SHA=$(curl -sSL --fail "$URL" | sha256sum | awk '{print $1}')
          {
            echo "tag=${TAG}"
            echo "url=${URL}"
            echo "sha256=${SHA}"
          } >> "$GITHUB_OUTPUT"
          echo "Resolved ${TAG} → sha256=${SHA}"

      - name: Render formula into the tap
        run: |
          set -euo pipefail
          mkdir -p homebrew-tap/Formula
          cp corpus-forge/packaging/distribution/corpus-forge.rb \
             homebrew-tap/Formula/corpus-forge.rb
          # Belt-and-suspenders: rewrite url + sha256 from the live
          # tarball in case the in-repo scaffold drifted from this tag
          # (e.g. if the release pipeline re-fires after a fixup commit
          # that didn't touch the scaffold).
          sed -i -E \
            -e "s|^(  url )\"[^\"]+\"|\\1\"${{ steps.meta.outputs.url }}\"|" \
            -e "s|^(  sha256 )\"[a-f0-9]+\"|\\1\"${{ steps.meta.outputs.sha256 }}\"|" \
            homebrew-tap/Formula/corpus-forge.rb

      - name: Commit and push
        working-directory: homebrew-tap
        run: |
          set -euo pipefail
          git config user.name  "corpus-forge release bot"
          git config user.email "ulmentflam@users.noreply.github.com"
          git add Formula/corpus-forge.rb
          if git diff --cached --quiet; then
            echo "Formula already up to date for ${{ steps.meta.outputs.tag }}; nothing to push."
            exit 0
          fi
          git commit -m "corpus-forge ${{ steps.meta.outputs.tag }}"
          git push

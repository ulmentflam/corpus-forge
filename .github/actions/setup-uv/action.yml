name: Setup uv + Python environment
description: >-
  Install uv, restore the uv + Hugging Face caches, and run
  `uv sync --all-extras --group dev` so subsequent steps have the full
  development toolchain available. This composite action is the entry
  point used by both ci.yml and (later) release.yml.

inputs:
  python-version:
    description: Python version to provision via uv.
    required: false
    default: "3.13"

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        # Enable uv's built-in cache layer (covers ~/.cache/uv).
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Provision Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install "${{ inputs.python-version }}"

    - name: Restore Hugging Face model cache
      uses: actions/cache@v4
      with:
        # Sentence-transformers and reranker models live here; cached
        # separately from uv so warm runs skip the cold-download cost.
        path: ~/.cache/huggingface
        key: hf-${{ runner.os }}-${{ hashFiles('pyproject.toml', 'uv.lock') }}
        restore-keys: |
          hf-${{ runner.os }}-

    - name: Sync dependencies (dev + all extras)
      shell: bash
      run: uv sync --all-extras --group dev

name: Setup uv + Python environment
description: >-
  Install uv, restore the uv + Hugging Face caches, and run
  `uv sync --all-extras --group dev` so subsequent steps have the full
  development toolchain available. This composite action is the entry
  point used by both ci.yml and (later) release.yml.

inputs:
  python-version:
    description: Python version to provision via uv.
    required: false
    default: "3.13"
  warm-hf-cache:
    description: >-
      Restore (or, on a miss, pre-download) the HuggingFace model cache
      driven by ``.github/ci-models.txt``.  When ``'true'``, the cache
      is keyed on the hash of that file so the cache stays valid until
      the model list itself changes — unrelated dependency bumps to
      ``pyproject.toml`` / ``uv.lock`` no longer invalidate it.
      Callers that don't load HF models (e.g. lint-only jobs, the
      install-smoke workflow) can leave this at its ``'false'`` default
      to skip the restore + warm steps entirely.
    required: false
    default: "false"
  hf-token:
    description: >-
      HuggingFace Hub token forwarded to the warm step (issue #90,
      option 1).  Authenticated requests get a far higher rate limit
      than the anonymous shared-runner-IP pool, so a cold-cache warm
      is much less likely to ride out a 429 storm.  Callers pass
      ``${{ secrets.HF_TOKEN }}`` — composite actions cannot read the
      ``secrets`` context themselves.  Empty (fork PRs, secret not
      configured) is safe: huggingface_hub treats an empty
      ``HF_TOKEN`` as anonymous.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v6
      with:
        # Enable uv's built-in cache layer (covers ~/.cache/uv).
        enable-cache: true
        cache-dependency-glob: |
          uv.lock
          pyproject.toml

    - name: Provision Python ${{ inputs.python-version }}
      shell: bash
      run: uv python install "${{ inputs.python-version }}"

    - name: Restore Hugging Face model cache
      id: hf-cache
      if: inputs.warm-hf-cache == 'true'
      uses: actions/cache@v5
      with:
        # Sentence-transformers / faster-whisper / cross-encoder all
        # read from ~/.cache/huggingface/hub, so caching the parent
        # directory covers every loader corpus-forge uses.
        path: ~/.cache/huggingface
        # Keyed on ``.github/ci-models.txt``: the cache stays valid
        # until the model list itself changes — unrelated dep bumps
        # to pyproject.toml / uv.lock no longer rotate the multi-GB
        # model cache.
        key: hf-${{ runner.os }}-${{ hashFiles('.github/ci-models.txt') }}
        restore-keys: |
          hf-${{ runner.os }}-

    - name: Sync dependencies (dev + all extras)
      shell: bash
      run: uv sync --all-extras --group dev

    - name: Warm Hugging Face cache (cache miss only)
      # Cold cache: download every model listed in
      # ``.github/ci-models.txt`` once, so the subsequent test steps
      # can run under ``HF_HUB_OFFLINE=1`` and fail loudly on a
      # missing model rather than silently retrying through a Hub
      # 429 storm.  No-op on cache hit (which is the common path
      # after the first warm run).
      if: inputs.warm-hf-cache == 'true' && steps.hf-cache.outputs.cache-hit != 'true'
      shell: bash
      # The token is scoped to exactly this step — the only step in
      # any workflow that talks to the Hub (test steps run with
      # HF_HUB_OFFLINE=1).
      env:
        HF_TOKEN: ${{ inputs.hf-token }}
      run: uv run python .github/scripts/warm_hf_cache.py

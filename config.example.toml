# ~/.config/corpus-forge/config.toml

[backend]
kind   = "postgres"
dsn    = "postgresql://${PG_USER}:${PG_PASSWORD}@${PG_HOST}:${PG_PORT}/${PG_DB}"
schema = "corpus"

# ── Alternative: SQLite (single-host, zero-setup) ──────────────────────────
# Comment out the [backend] block above and uncomment this one to use SQLite.
# `dsn` is repurposed as the path to the database file (or ":memory:").
# Install the optional vec0 extension with: pip install 'corpus-forge[sqlite]'.
# NOTE: sync_enabled = true on any dataset is rejected with kind = "sqlite".
#
# [backend]
# kind = "sqlite"
# dsn  = "~/Library/Application Support/corpus-forge/corpus.db"

[daemon]
debounce_seconds     = 2.0
log_level            = "INFO"
log_format           = "text"  # 'text' | 'json'
host_id              = ""  # unique machine identifier (leave empty for auto)
trash_dir            = "~/.local/share/corpus-forge/trash"
conflict_dir         = "~/.local/share/corpus-forge/conflicts"
sync_poll_interval_s = 30  # seconds between sync polls

[[datasets]]
name         = "obsidian-vault"
kind         = "text"
sync_enabled = true
  [[datasets.sources]]
  plugin         = "markdown_vault"
  vault_root     = "~/Library/Mobile Documents/iCloud~md~obsidian/Documents"
  vault_names    = []  # [] = all subdirectories
  exclude_globs  = [".obsidian/**", ".trash/**", ".*", "*.icloud"]
  chunker        = "markdown"
  chunker_config = { max_chars = 1500, overlap = 200 }

[[datasets]]
name = "claude-code"
kind = "chat"
  [[datasets.sources]]
  plugin            = "claude_code"
  projects_root     = "~/.claude/projects"
  include_subagents = true
  chunker           = "conversation"
  chunker_config    = { mode = "per_message", role_prefix = true }

[[datasets]]
name = "opencode"
kind = "chat"
  [[datasets.sources]]
  plugin         = "opencode"
  storage_root   = "~/.local/share/opencode/storage"
  chunker        = "conversation"
  chunker_config = { mode = "sliding_window", window_turns = 6, stride_turns = 3 }

# ─────────────────────────────────────────────────────────────────────
# Phase D — Multi-format ingest example
# ─────────────────────────────────────────────────────────────────────
# Heterogeneous source: PDFs, Office docs, notebooks, code, prose,
# subtitles, structured data — anything human-readable on disk. Uses the
# `filesystem` source plugin and the extractor registry.
#
# [multi-format] + [code] optional extras are required:
#   uv sync --extra multi-format --extra code
[[datasets]]
name        = "knowledge-base"
kind        = "text"
description = "Heterogeneous personal corpus (research papers, codebases, notebooks)."

  [[datasets.sources]]
  plugin = "filesystem"
  root   = "~/Documents/research"
  exclude_globs = [
    ".git/**", "node_modules/**", "**/__pycache__/**",
    ".venv/**", "target/**", "build/**", "dist/**",
    "*.icloud", ".trash/**", ".DS_Store",
  ]
  # ChunkerDispatcher picks per-document chunker from each extractor's hint.
  # This `chunker` is the fallback for sources that don't set a hint (none here).
  chunker        = "markdown"
  chunker_config = { max_chars = 1500, overlap = 200 }

    [datasets.sources.extraction]
    enable_pdf      = true
    enable_office   = true
    enable_code     = true
    enable_html     = true
    enable_epub     = true
    enable_notebook = true
    enable_csv      = true
    csv_max_rows    = 200
    max_bytes       = 50_000_000
    code_chunker_config = { max_chars = 1500, min_chars = 100, overlap = 100 }

# ─────────────────────────────────────────────────────────────────────
# Zotero library connector (Phase M Wave 4).
# Three modes: "local" (default), "web", "both".
# - "local" reads ~/Zotero/zotero.sqlite directly (read-only, immutable=1
#           so it co-exists with a running Zotero instance).
# - "web"   talks to https://api.zotero.org. Requires user_id + an API
#           key in the env var named by `api_key_env` (default
#           ZOTERO_API_KEY).
# - "both"  reads both and reconciles on `zotero_item_key` — local wins
#           unless the web's `dateModified` is strictly newer.
#
# PDF attachments flow through PdfDigitalExtractor; Zotero item metadata
# (authors, year, DOI, collection, tags, abstract) is enriched onto each
# RawDocument so it propagates to chunks via the existing pipeline.
#
# Uncomment when you have a Zotero library to ingest.
#
# [[datasets]]
# name        = "zotero-library"
# kind        = "text"
# description = "PDFs + abstracts from a Zotero library."
#
#   [[datasets.sources]]
#   plugin = "zotero"
#   chunker = "markdown"
#
#     [datasets.sources.zotero]
#     mode = "local"
#     library_path = "~/Zotero/zotero.sqlite"
#     include_attachments = ["application/pdf"]
#     # Empty include = every collection; otherwise prefix match.
#     # include_collections = ["Research/Quantum"]
#     # exclude_collections = ["Archive"]
#
#     # Web mode (or `both`) needs these:
#     # mode = "web"   # or "both"
#     # user_id = "1234567"
#     # api_key_env = "ZOTERO_API_KEY"
#     # library_type = "user"  # or "group"; group_id required when "group"
#     # base_url = "https://api.zotero.org"
#     # cache_dir = "~/.cache/corpus-forge/zotero"

[[embedders]]
name      = "qwen3_8b"
provider  = "sentence_transformers"
model_id  = "Qwen/Qwen3-Embedding-8B"
dimension = 4096
normalize = true
distance  = "cosine"
active    = true
batch_size = 16
device    = "auto"  # 'auto'|'mps'|'cuda'|'cpu'

[[embedders]]
name      = "openai_3l"
provider  = "openai"
model_id  = "text-embedding-3-large"
dimension = 3072
normalize = true
distance  = "cosine"
active    = false  # enable when cloud redundancy is wanted
api_key_env = "OPENAI_API_KEY"
batch_size  = 256
# Optional: point at any OpenAI-compatible endpoint (local vLLM,
# llama.cpp's OpenAI shim, LiteLLM, etc.). Same backend, swapped
# entirely by config. Leave unset for the real OpenAI API.
# base_url = "http://localhost:8000/v1"

# ─────────────────────────────────────────────────────────────────────
# Phase D / Wave 4 — VLM (vision-language model) OCR backend
# ─────────────────────────────────────────────────────────────────────
# Drives `corpus_forge.vlm.get_active_vlm`. Used by the PDF Tier-2
# escalation path (sparse text layer detected → rasterise + OCR) and
# by the `ImageExtractor`. The default `backend = "none"` keeps the
# legacy markdown-vault / chat ingest flows untouched: no VLM is ever
# constructed unless you opt in here.
#
# Local-or-remote URL: `ollama_url` accepts ANY Ollama-compatible
# endpoint. The default is `http://localhost:11434` (a local daemon).
# To point at a hosted Ollama running on a beefier box (or a vLLM /
# OpenAI-shape proxy speaking the same `/api/generate` shape), swap
# the URL — no code change required. Same principle applies to the
# `[classifier]` block's `llm_url` below.
[vlm]
# Which backend to use:
#   "none"    — disabled (default; PDF/image OCR never runs).
#   "ollama"  — local Ollama daemon serving a vision-language model.
#   "mistral" — Mistral's hosted OCR API (requires MISTRAL_API_KEY).
backend            = "none"

# Ollama-only knobs (ignored when backend != "ollama").
# Tag installed via `ollama pull qwen2.5vl:7b`. Apache-2.0, ~5 GB,
# DocVQA 95.7. The 32B variant is also accepted.
ollama_model       = "qwen2.5vl:7b"
# Base URL of the Ollama-compatible endpoint (`/api/generate` is
# appended by the backend). Strip trailing slashes are tolerated.
ollama_url         = "http://localhost:11434"
# Remote alternative — uncomment if Ollama is running on another host
# (M-series with 64 GB / a beefier workstation) and you want OCR
# offloaded so this laptop stays responsive. Same model contract.
# ollama_url       = "https://ollama.internal.example.com"

# Mistral-only knobs (ignored when backend != "mistral").
# Model id for the Mistral OCR endpoint.
mistral_model      = "mistral-ocr-2503"
# API base; the backend appends `/ocr`.
mistral_base_url   = "https://api.mistral.ai/v1"
# Name of the env var holding the API key (read from secrets.env).
# Must be a valid POSIX identifier — `corpus-forge` rejects bad names
# at config-load time so typos surface immediately.
mistral_api_key_env = "MISTRAL_API_KEY"

# Per-request HTTP budget for both backends (seconds). qwen2.5vl:7b
# takes 1-3 s for a clean text page on M-series; 120 s leaves slack
# for noisy / multi-page rasterisations on a cold model.
timeout_s          = 120.0

# ─────────────────────────────────────────────────────────────────────
# Phase E — Document classification (content-class labels)
# ─────────────────────────────────────────────────────────────────────
# Walks ingested documents and attaches a `class=<value>` strong label
# from a 9-value enum (`code`, `chat`, `book`, `textbook`, `paper`,
# `article`, `reference`, `note`, `other`). The classifier chain
# starts with a stdlib rule classifier (microseconds/doc) and falls
# back to a local-LLM classifier (Ollama qwen2.5:7b-instruct, ~5-10
# s/doc on M-series) when the rule classifier's confidence is below
# `escalation_threshold`. High-confidence rule outputs short-circuit
# the LLM — the cost guard prints a worst-case estimate before each
# run starts. Run via:
#
#     corpus-forge classify             # apply the configured chain
#     corpus-forge classify --dry-run   # preview without writing
#     corpus-forge classify --json      # one JSON line per document
#     corpus-forge classify --classifier rule  # bypass the LLM
#
# Local-or-remote URL: `llm_url` accepts ANY Ollama-compatible
# endpoint. Default is `http://localhost:11434` (local). Same swap
# story as `[vlm].ollama_url` — useful when classification should
# run on a beefier host than the laptop doing ingest.
[classifier]
# Ordered list of classifier names to walk. Each entry must be a key
# in the lazy-loader registry: `"rule"` (always available) and
# `"llm"` (requires the [ocr] extra at runtime for `requests`). To
# disable LLM escalation entirely, set `chain = ["rule"]`.
chain                = ["rule", "llm"]

# Confidence floor (0.0..1.0) used by `ClassifierRegistry.classify`.
# The first classifier whose confidence >= this value wins outright
# and the chain short-circuits. Below this, the chain walks to the
# next classifier. Tune lower (e.g. 0.3) to force more LLM calls and
# rely less on the rule classifier's path heuristics; tune higher
# (e.g. 0.6) to make the rule classifier the dominant signal.
escalation_threshold = 0.4

# Ollama tag for the LLM classifier. Default qwen2.5:7b-instruct is
# the project's calibrated baseline (strong on the 9-way task, fits
# 64 GB unified memory). Swap to `qwen2.5:3b-instruct` for a faster
# / less accurate variant, or any other Ollama-served chat model.
llm_model            = "qwen2.5:7b-instruct"

# Base URL of the Ollama-compatible endpoint serving `llm_model`.
# `/api/generate` is appended by the backend.
llm_url              = "http://localhost:11434"
# Remote alternative — uncomment if you run a hosted Ollama / vLLM /
# OpenAI-shape proxy. Useful when classification should run on a
# different machine than the one doing ingest (e.g. a beefier box on
# the local network).
# llm_url            = "https://ollama.internal.example.com"

# Optional bearer token for authenticated remote endpoints. Names the
# env var the key is read from (read from secrets.env at start-up).
# Empty (default) omits the Authorization header — matches the open
# local Ollama daemon. Cross-cutting: same shape as `vlm`,
# `whisper`, and `code_enricher` blocks.
# llm_api_key_env    = "OPENAI_API_KEY"

# Per-request HTTP budget (seconds). qwen2.5:7b-instruct takes ~5-10
# s for a 2 KB excerpt on a warm model; 60 s leaves slack for the
# first call (model load + initial token).
llm_timeout_s        = 60.0

# Sampling temperature (0.0..2.0). 0.0 is deterministic — the right
# choice for a classifier. Raise only if you want diverse rationales
# at the cost of label stability across runs.
llm_temperature      = 0.0

# Total head+tail budget passed to the LLM (chars). The classifier
# never sees the document middle — a 9-way task doesn't need it. The
# 2000 default fits comfortably inside qwen2.5:7b-instruct's 8K
# context with prompt overhead.
llm_excerpt_chars    = 2000

# ─────────────────────────────────────────────────────────────────────
# Phase G — Whisper transcription (audio + video → Markdown)
# ─────────────────────────────────────────────────────────────────────
# Routes ``.mp3 .wav .m4a .ogg .flac`` and ``.mp4 .mov .webm .mkv .avi``
# files through a Whisper-family transcription model so audio/video
# content becomes ingestable Markdown (with timestamp anchors for
# local backends). The default ``backend = "none"`` skips every audio/
# video file silently — opt in here to enable.
#
# Local-or-remote URL: same principle as the [vlm] / [classifier]
# blocks above. ``remote_base_url`` accepts ANY OpenAI-compatible
# Whisper endpoint (OpenAI, Groq, Replicate, self-hosted whisper.cpp
# via HTTP). The default points at OpenAI; uncomment the Groq URL
# below for the faster free-tier provider.
#
# The [whisper] extra installs both backends + ffmpeg:
#   uv sync --extra whisper
[whisper]
# Which backend to use:
#   "none"   — disabled (default; audio/video files silently skipped).
#   "local"  — in-process faster-whisper (model lives on this box).
#   "remote" — OpenAI-compatible HTTP endpoint (see remote_base_url).
backend            = "none"

# Whisper model.
# - local : tiny | base | small | medium | large  (default: small)
# - remote: provider-specific (OpenAI: whisper-1; Groq: whisper-large-v3)
model              = "small"

# Local-only knob (ignored when backend != "local"):
# Precision for faster-whisper. "auto" picks int8 on CPU and float16
# on CUDA. Force "float16" / "int8" / "int8_float16" to override.
local_compute_type = "auto"

# Remote-only knobs (ignored when backend != "remote"):
# Base URL of the OpenAI-compatible Whisper endpoint. The backend
# appends ``/audio/transcriptions``.
remote_base_url    = "https://api.openai.com/v1"
# Remote alternative — Groq's whisper-large-v3 is ~10x faster than
# OpenAI's whisper-1 on the free tier. Set ``remote_api_key_env =
# "GROQ_API_KEY"`` and add the key to secrets.env.
# remote_base_url  = "https://api.groq.com/openai/v1"
# Self-hosted whisper.cpp speaking the same multipart contract.
# remote_base_url  = "http://whisper.internal.example.com:8080/v1"

# Name of the env var holding the API key (read from secrets.env).
# Must be a valid POSIX identifier — corpus-forge rejects bad names
# at config-load time so typos surface immediately.
remote_api_key_env = "OPENAI_API_KEY"

# Per-request HTTP / per-file wall budget (seconds). Real audio
# commonly takes 10-60 s to transcribe; 300 s leaves comfortable
# slack for multi-minute clips.
timeout_s          = 300.0

# ISO-639-1 language hint (empty string = auto-detect). Set to e.g.
# "en" to force English when working with monolingual corpora — both
# faster and slightly more accurate than auto-detect.
language           = ""

# ─────────────────────────────────────────────────────────────────────
# Phase G P1 — Multi-modal embeddings (text + image shared vector space)
# ─────────────────────────────────────────────────────────────────────
# Multi-modal embedders are activated on-demand via the CLI rather than
# a TOML block (Phase G P1 keeps the config surface narrow). The
# default local backend is ``ClipLocalEmbedder`` with ``clip-ViT-B-32``
# (512 d, ~150 MB, MIT). Run image-embedding backfill with:
#
#     corpus-forge embed -e clip_local --image
#
# The backend transparently creates an ``image_embeddings_clip_local``
# table on first run (mirrors the per-text-embedder
# ``embeddings_<name>`` family).
#
# Local-or-remote URL: a future ``[multimodal]`` block will gate the
# remote :class:`ClipRemoteEmbedder` against an OpenAI-compatible
# ``/embeddings`` endpoint (Voyage AI ``voyage-multimodal-3``, Cohere
# ``embed-v3-multimodal``, or a self-hosted CLIP service). For now,
# users wire the remote backend directly in code if needed.

# ─────────────────────────────────────────────────────────────────────
# Phase H — Code enrichment (synthesised docstrings + summaries)
# ─────────────────────────────────────────────────────────────────────
# Runs an LLM over every chunk whose parent document carries
# ``class=code`` (Phase E classifier output) and writes the result to
# ``chunks.metadata.enrichment``. Each enrichment carries:
#   - docstring : synthesised when the construct lacks one
#   - summary   : 1-2 sentence semantic summary in domain language
#   - symbols   : referenced symbol names (functions / types)
#   - model     : the model tag that produced the enrichment
#   - confidence: self-reported [0.0, 1.0]
#
# Idempotent: chunks already carrying an enrichment with the current
# model tag are skipped by ``corpus-forge enrich``. Re-enrich on model
# change is automatic — change the tag and the next run reprocesses.
#
# **Local-or-remote URL** (cross-cutting principle): Phase H ships
# TWO concrete backends to satisfy the policy:
#   - ``backend = "local"``  → Ollama on this box (``local_url``).
#   - ``backend = "remote"`` → hosted Ollama or any OpenAI-compatible
#     chat-completions endpoint (``remote_url`` + ``remote_api_shape``).
# Both ``local_url`` AND ``remote_url`` are first-class config fields.
[code_enricher]
# Which backend to use:
#   "none"   — disabled (default; ``corpus-forge enrich`` is a no-op
#              until you flip this knob).
#   "local"  — local Ollama daemon (qwen3.6:35b-a3b-instruct by default;
#              MoE 35B/~3B active, ~22 GB on disk, fits 64 GB unified
#              memory on M-series with comfortable headroom).
#   "remote" — remote URL speaking either the Ollama or OpenAI-compat
#              chat-completions shape. See ``remote_api_shape`` below.
backend            = "none"

# Local-only knobs (ignored when backend != "local"):
# Ollama tag served by the local daemon. Swap to ``qwen2.5-coder:7b``
# for a smaller / faster alternative (or any other Ollama-served
# code-capable chat model).
local_model        = "qwen3.6:35b-a3b-instruct"

# Base URL of the local Ollama-compatible endpoint. ``/api/generate``
# is appended by the backend.
local_url          = "http://localhost:11434"

# Remote-only knobs (ignored when backend != "remote"):
# Model tag for the remote backend. Match what your remote endpoint
# advertises — for hosted Ollama, the same tag format
# (``qwen3.6:35b-a3b-instruct``). For an OpenAI-compatible proxy,
# whatever model name the proxy exposes.
remote_model       = "qwen3.6:35b-a3b-instruct"

# Base URL of the remote endpoint.
#   - Hosted Ollama (api_shape="ollama"): ``/api/generate`` is appended.
#   - OpenAI-compat (api_shape="openai"): ``/chat/completions`` is appended.
remote_url         = "http://localhost:11434"
# Remote alternative — hosted Ollama on an internal box (you'd point
# this at, say, a Mac Studio doing nothing but inference). Pair with
# ``remote_api_shape = "ollama"`` and an optional ``OLLAMA_API_KEY``
# in secrets.env for bearer auth.
# remote_url       = "https://ollama.internal.example.com"
# Remote alternative — OpenAI-compatible proxy (vLLM,
# text-generation-inference, llama.cpp's OpenAI shim, or a SaaS like
# Together / DeepInfra / Fireworks). Pair with
# ``remote_api_shape = "openai"`` and the matching API key env var.
# remote_url       = "https://api.together.xyz/v1"

# Which API shape the remote endpoint speaks:
#   "ollama" — ``POST /api/generate`` (Ollama wire format).
#   "openai" — ``POST /chat/completions`` with response_format=json_object.
# The local backend always uses the Ollama shape.
remote_api_shape   = "ollama"

# Name of the env var holding the remote API key (read from
# secrets.env). Must be a valid POSIX identifier — corpus-forge rejects
# bad names at config-load time so typos surface immediately. The
# Ollama shape tolerates an empty key (header is just omitted); the
# OpenAI shape treats absence as fatal at construction.
remote_api_key_env = "OLLAMA_API_KEY"

# Per-request HTTP budget (seconds). qwen3.6:35b-a3b-instruct hits
# ~3-8 s/chunk on M-series for typical code chunks; 180 s leaves slack
# for cold starts and long chunks.
timeout_s          = 180.0

# Sampling temperature (0.0..2.0). 0.1 keeps phrasing reproducible
# while allowing minor variation in summaries. Drop to 0.0 if you want
# bit-for-bit determinism across runs.
temperature        = 0.1

# ─────────────────────────────────────────────────────────────────────
# Phase J / J1 — sync storage estimator
# ─────────────────────────────────────────────────────────────────────
# Drives `corpus-forge estimate <path>` and the MCP tool
# `estimate_sync_size`. The estimator predicts the Postgres footprint of
# syncing a folder WITHOUT touching the database — no backend opens, no
# extractor runs, no model calls. Pure prediction over the per-extractor
# heuristic table.
#
# The only knob today is TOAST compression. Postgres compresses long
# text columns with LZ4 (or pglz on older clusters); for English prose
# the typical ratio is ~0.5. Default `1.0` is the conservative
# no-compression baseline — drop it to `0.5` when you've moved
# `documents.text` and `chunks.text` to `STORAGE EXTENDED` with LZ4.
[estimate]
# Multiplier applied to the bytes attributed to text-heavy columns
# (`documents.text`, `chunks.text`). Must be in `(0.0, 1.0]`.
#   1.0 — uncompressed (default; safest over-estimate).
#   0.5 — typical LZ4 ratio on English prose.
#   0.3 — aggressive LZ4 on highly-redundant text (logs, structured
#         JSON, repetitive docs).
# Embeddings, btree indexes, and row overhead are NOT compressed —
# the ratio only touches the text columns.
compression_ratio = 1.0

# ─────────────────────────────────────────────────────────────────────
# Phase N Wave 1 — adaptive lexical-weight bump
# ─────────────────────────────────────────────────────────────────────
# The `[retrieval]` block tunes the `HybridRetriever` end-to-end. The
# Wave 1 release ships two new opt-in knobs that lower the fusion alpha
# on symbol-shaped queries so the BM25 (lexical) signal contributes
# more to the blend — semble's identifier-search advantage, ported as
# a config-gated A/B without subclassing the retriever.
#
# Defaults are OFF on every knob — opt in here once you want to test.
#
# When does the bump fire?
#   - `adaptive_lexical_weight = true` AND
#   - `fusion = "alpha"` (the bump is a no-op on `"rrf"` — rank-only)
#     AND
#   - the query "looks like" a code symbol per
#     `corpus_forge.retrieval.query_shape.is_symbol_shaped`. Rules of
#     thumb: dotted accessors (`Foo.bar`), scope operators (`Foo::bar`,
#     `foo->bar`), path-like (`foo/bar/baz`), CamelCase / snake_case
#     identifiers, or leading-underscore privates (`_helper`).  Queries
#     containing whitespace are treated as natural language even when
#     they wrap a symbol — see the docstring for the full truth table.
# [retrieval]
# # Fusion strategy. `"rrf"` (default) is rank-only and ignores `alpha`;
# # `"alpha"` linearly blends per-list min-max normalised scores. Only
# # `"alpha"` exercises the Wave 1 bump.
# fusion              = "alpha"
#
# # Blend weight on the dense list when `fusion = "alpha"`. Higher =
# # more dense (semantic) weight; lower = more lexical (BM25). When the
# # adaptive bump fires, this is the BASE alpha — the bump swaps in
# # `symbol_query_alpha` for THAT query only.
# alpha               = 0.7
#
# # Phase N Wave 1: opt-in flag for the adaptive lexical-weight bump.
# # When `true`, identifier / accessor queries get a lower effective
# # alpha (the `symbol_query_alpha` below) so BM25 dominates. Natural-
# # language queries keep the base `alpha` above.
# adaptive_lexical_weight = true
#
# # The effective alpha to swap in when the bump fires. 0.3 was the
# # Wave 1 starting guess — lower numbers tip further toward lexical.
# # Validated to `[0.0, 1.0]`.
# symbol_query_alpha  = 0.3

# ─────────────────────────────────────────────────────────────────────
# Phase N Wave 2 — definition boost on retrieval
# ─────────────────────────────────────────────────────────────────────
# When enabled, retrieved hits whose metadata says they ARE a definition
# (every chunk emitted by the AST-walk code chunker carries
# `is_definition=True` + `definition_kind`) AND whose `metadata.name`
# matches a token in the query get a score multiplier in two places:
#
#   1. Pre-rerank: on the fused score dict BEFORE the rerank-slice
#      truncation, with multiplier `definition_boost_factor_pre_rerank`.
#   2. Post-rerank: on the reranker's output, with multiplier
#      `definition_boost_factor_post_rerank`.
#
# Wave 1's bench investigation found that the cross-encoder reranker
# emits its own scores and discards upstream fused scores — so the
# pre-rerank boost alone produces no observable headline lift when
# rerank is on.  The post-rerank application is the load-bearing one;
# both fire on the same flag but the multipliers are independent so a
# follow-up A/B can measure each separately.
#
# Tokenisation is whole-word: the query is lowercased and split on
# non-identifier chars (`[^A-Za-z0-9_]+`), then each token is compared
# for equality with the chunk's lowercased `metadata.name`.  Substring
# matches do NOT boost — `"directory"` does not lift a definition
# named `"directory_pruned"`.
#
# The boost only fires on chunks freshly chunked under Wave 2 — older
# corpora need a re-ingest to pick up the `is_definition` flag.
# [retrieval]
# # Phase N Wave 2: opt-in flag for the definition boost.
# definition_boost_enabled = true
#
# # Pre-rerank multiplier (applied on the fused score dict).  Validated
# # to `[1.0, 5.0]`; default 1.5.
# definition_boost_factor_pre_rerank  = 1.5
#
# # Post-rerank multiplier (applied on the reranker's output).
# # Validated to `[1.0, 5.0]`; default 1.2.  Kept smaller than the
# # pre-rerank factor because the cross-encoder's score scale is tight
# # — a heavy multiplier swamps it.
# definition_boost_factor_post_rerank = 1.2

# ─────────────────────────────────────────────────────────────────────
# Phase N Wave 3 — static-embedding fast tier (model2vec)
# ─────────────────────────────────────────────────────────────────────
# Wires an OPTIONAL second embedder (default: `minishlab/potion-code-16M`,
# 256-dim, MIT, ~16 MB, CPU-fast) in front of the main embedder +
# cross-encoder reranker as a candidate generator.  Two activation
# modes available at search time via `SearchOptions.fast_tier_mode`:
#
#   "shortcut" — fast embedder runs first; top-N candidates seed the
#                main dense+lexical fan-out via the backend's
#                `chunk_ids=` filter.  Reranker + Wave 2 boost still
#                compose normally.  Best quality + dramatic p50 drop
#                (the cross-encoder only sees the slice).
#
#   "only"     — fast embedder produces top-k directly.  No lexical,
#                no rerank.  Sub-10ms p50 on identifier queries in
#                bench.  Lower quality acceptable for latency-bound
#                paths.
#
#   "skip"     — pre-Wave-3 behaviour (default).
#
# Install the extra:  pip install 'corpus-forge[fast-tier]'
#
# Step 1 — declare a SECOND embedder under `[[embedders]]`:
#
# [[embedders]]
# name      = "potion-code-16M"
# provider  = "model2vec"
# model_id  = "minishlab/potion-code-16M"
# dimension = 256
# normalize = true
# distance  = "cosine"
# active    = true
#
# Step 2 — point `[retrieval].fast_tier_embedder_name` at that name.
# The validator rejects a typo at config-load time so a misconfigured
# deploy doesn't silently dispatch as if the fast tier weren't wired.
#
# [retrieval]
# fast_tier_embedder_name = "potion-code-16M"
#
# Callers then opt in per search via SearchOptions:
#
#     opts = SearchOptions(
#         k=10,
#         fast_tier_mode="shortcut",   # or "only" / "skip" (default)
#         fast_tier_top_n=200,         # candidate pool size for shortcut
#     )
#
# Default settings preserve pre-Wave-3 behaviour exactly.

# ─────────────────────────────────────────────────────────────────────
# Phase M Wave 2 — filesystem walker
# ─────────────────────────────────────────────────────────────────────
# Drives the unified `os.scandir`-based walker shared by the estimator
# and the `filesystem` source plugin. The walker prunes baseline-skip
# dirs (`.git`, `node_modules`, `__pycache__`, `dist`, `build`, ...)
# AND any `.corpusignore` directory patterns DURING descent — it never
# scandir's into a pruned subtree. File-extension short-circuit runs
# BEFORE `stat()` so non-corpus blobs (`.iso`, `.dmg`) cost nothing.
#
# All fields are optional; omitting the block keeps default behaviour.
[scan]
# Additional directory NAMES (not paths) to prune wholesale, stacked
# on top of the hard-coded baseline. Per-name match, not per-path.
# Useful for site-local conventions ("build_legacy", "wasm-pack", ...).
extra_skip_dirs = []

# When `true`, symlinked directories are descended. Default `false`
# keeps the walker from chasing cycles or double-counting via symlinks
# (the behaviour both pre-Wave-2 walkers had).
follow_symlinks = false

# Concurrency knob — API-plumbed but not yet implemented. Leave at 1
# until a future revision lands a thread pool to overlap stat calls.
# Values > 1 raise `NotImplementedError` at walk-time.
workers = 1


# git-cliff config for corpus-forge.
# Docs: https://git-cliff.org/docs/configuration/
#
# Renders release notes that mirror the in-repo [role] phase-slice:
# commit-message convention, with conventional-commit recognition for
# external contributors.

[changelog]
header = """
# Changelog\n
All notable changes to **corpus-forge** are recorded here.\n
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}*{{ commit.scope }}*: {% endif %}\
            {{ commit.message | upper_first }}\
            {% if commit.breaking %}{{ " [**BREAKING**]" }}{% endif %}\
    {% endfor %}
{% endfor %}\n
"""
trim = true
footer = """
<!-- generated by git-cliff -->
"""

[git]
# Match v-prefixed tags including PEP 440 prereleases (v0.1.0b1, v0.1.0rc1).
tag_pattern = "v[0-9].*"
conventional_commits = true
filter_unconventional = false
split_commits = false
protect_breaking_commits = false
filter_commits = false
sort_commits = "newest"
topo_order = false

commit_parsers = [
    # Conventional Commits (external contributors).
    { message = "^feat", group = "Added" },
    { message = "^fix", group = "Fixed" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactored" },
    { message = "^docs", group = "Documentation" },
    { message = "^test", group = "Tests" },
    { message = "^build", group = "Build" },
    { message = "^chore", group = "Chores" },
    { message = "^ci", group = "CI" },
    # In-repo [tdd-*] phase-slice convention.
    { message = "^\\[tdd-coder\\]", group = "Implementation" },
    { message = "^\\[tdd-tester\\]", group = "Tests" },
    { message = "^\\[tdd-qa\\]", group = "QA" },
    { message = "^\\[tdd-principal\\]", group = "Coordination" },
    { message = "^\\[deps\\]", group = "Dependencies" },
    { message = "^\\[deps-ci\\]", group = "Dependencies" },
    # Everything else.
    { message = ".*", group = "Other" },
]

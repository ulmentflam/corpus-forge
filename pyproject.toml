[build-system]
requires      = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name            = "corpus-forge"
version         = "0.1.0b13"
description     = "Chat with your data. Forge a living, trainable corpus from your notes, code, and chat history."
requires-python = ">=3.11,<3.14"
license         = "Apache-2.0"
license-files   = ["LICENSE"]
readme          = "README.md"
authors         = [{ name = "Evan Owen", email = "evan@jwo3.io" }]
keywords = [
  "huggingface",
  "datasets",
  "fine-tuning",
  "training-corpus",
  "embeddings",
  "pgvector",
  "sqlite-vec",
  "obsidian",
  "claude-code",
  "rag",
  "personal-knowledge",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: MacOS",
  "Operating System :: Microsoft :: Windows",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Database",
  "Typing :: Typed",
]
dependencies = [
  "sentence-transformers>=3.0",
  # `torch`/`torchvision` are pulled transitively by sentence-transformers
  # (and torch is imported directly in `corpus_forge/eval/embedder_ranking.py`).
  # Declared here so the `[tool.uv.sources]` CPU-index override below actually
  # reaches them — uv only applies sources to *declared* dependencies, not to
  # third-party transitive ones. Keeps the Linux install off the multi-GB CUDA
  # stack. See the `[tool.uv.sources]` block at the bottom of this file.
  "torch>=2.2",
  "torchvision>=0.17",
  "psycopg[binary]>=3.1",
  # Connection pool for ``PostgresBackend``. Without it the backend opened
  # a fresh TCP+TLS+auth handshake to Postgres on every call (the old
  # ``# For now, we'll create a new connection each time`` TODO), which
  # cost ~41ms per backend op over Tailscale and dominated per-file
  # ingest time. Profiled 2026-05-27 against the maintainer's vault.
  "psycopg-pool>=3.2",
  "pgvector>=0.3",
  "watchdog>=4.0",
  "typer>=0.12",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "tenacity>=8.2",
  "alembic>=1.13",
  # Phase M Wave 4: ``httpx`` is the HTTP client for the Zotero Web API
  # connector (``corpus_forge.zotero.web_client``). Synchronous client only;
  # the ingest loop is single-threaded so we don't need anyio/asyncio.
  "httpx>=0.27",
  # Phase L Wave 1: promote `rich` (transitive via Typer) + `platformdirs`
  # (transitive via Pydantic) to direct deps. `rich` drives the new
  # `corpus_forge/ui/` package (theme, console, banner, progress,
  # prompts); `platformdirs` resolves the rotating-log directory in
  # `corpus_forge/logging_config.py`.
  "rich>=13.0",
  "platformdirs>=4.0",
  # Phase L Wave 6: redactor walks a tomlkit document so comments and key
  # order survive the `bug-report` config snapshot. tomlkit is also the
  # forward foundation for the Wave 7 `config edit` round-trip CRUD.
  "tomlkit>=0.13",
  # The ``openai`` SDK is the HTTP client behind ``provider = "openai"``
  # in ``[[embedders]]`` (and the same shape for any other config field
  # that names an OpenAI-compatible endpoint). The name refers to the
  # REST *protocol*, not the SaaS — local servers like Ollama
  # (``:11434/v1``), vLLM, llama.cpp's server, and LM Studio all expose
  # the same wire shape. Promoted from a ``[openai]`` extra to a base
  # dep because the failure mode (``"openai package is required"``
  # mid-ingest, after a long scan) is a nasty surprise for users who
  # never plan to hit ``api.openai.com``.
  "openai>=1.30",
]

[project.optional-dependencies]
# Back-compat alias — earlier docs and one-liners installed
# ``corpus-forge[openai]``. The SDK is now a base dep; the extra is
# preserved as an empty list so ``pip install corpus-forge[openai]``
# (and any downstream user of that incantation) keeps resolving
# without an "unknown extra" warning.
openai     = []
hf         = ["datasets>=2.20"]
tokens     = ["tiktoken>=0.7"]
sqlite     = ["sqlite-vec>=0.1"]
# R3: numpy floor for the retrieval surface (R1/R2) and the eval harness.
# `numpy` is already pulled in transitively by sentence-transformers, but
# pinning it here makes the dependency explicit for downstream consumers
# who install with `pip install corpus-forge[retrieval]` / `[eval]`.
# R4 lands `rerank` (sentence-transformers split anchor); R5 lands `mcp`
# (in-process MCP server scaffold for the `corpus-forge mcp serve` CLI).
retrieval  = ["numpy>=1.26"]
eval       = ["numpy>=1.26"]
# R4: cross-encoder reranker.  sentence-transformers is already a HARD
# dep of `corpus-forge` (see `[project] dependencies`), so this extra is
# currently documentational + a future-split anchor.  When the core dep
# moves out of `dependencies`, this extra becomes the install gate for
# the cross-encoder path.
rerank     = ["sentence-transformers>=3.0"]
# R5: Model Context Protocol server.  Pin `>=1.0,<2.0` to bracket the v1
# Server API surface; a v2 release would change the registration shape
# and silently break the in-process stdio adapter.
mcp        = ["mcp>=1.0,<2.0"]
# Phase D: tree-sitter-based code chunker (`CodeChunker`, D-02). Apache-2.0
# grammars via `tree-sitter-language-pack`. Lazy-imported inside
# `corpus_forge.chunkers.code` so the core install stays light.
code       = ["tree-sitter>=0.22", "tree-sitter-language-pack>=0.7"]
# Phase D Wave 1: document-extractor backends.
#
# License posture: this extra is the AGPL boundary for corpus-forge.
#   - pymupdf4llm  — AGPL-3.0 (user-approved 2026-05-14 for the milestone)
#   - ebooklib     — AGPL-3.0
#   - docling      — MIT (pulls torch transitively; gating it behind this
#                    extra keeps the core install light)
#   - markdownify, readability-lxml, jupytext, pandas, tabulate — permissive
# Installing `corpus-forge[multi-format]` therefore AGPL-binds the
# installed copy; the pure-core install stays Apache-2.0. README's
# "Distribution / licensing" section surfaces the trade-off.
multi-format = [
  "pymupdf4llm>=0.0.17",
  "docling>=2.0",
  "readability-lxml>=0.8",
  "markdownify>=0.13",
  "ebooklib>=0.18",
  "jupytext>=1.16",
  "pandas>=2.2",
  "tabulate>=0.9",
  # Phase F (F-05): True content-defined chunking via FastCDC rolling
  # hash. Pure-Python (MIT). The `CDCChunker` (F-01) is the new default
  # for prose classes (book/textbook/paper/article/note/other) once the
  # user has run `corpus-forge classify`. Pre-classification ingest
  # still uses the source-level fallback chunker — additive only.
  "fastcdc>=1.6",
]
# Phase D / Wave 4–5 (E-02, E-03, E-05, E-06): VLM (vision-language
# model) backends + PDF rasterisation for the OCR escalation path.
#
# License posture: requests (Apache-2.0), pdf2image (MIT), pillow
# (HPND, permissive). Adding [ocr] does NOT widen the AGPL surface
# introduced by [multi-format].
#
# System requirement: pdf2image wraps `poppler-utils` (BSD), which is
# NOT a Python dep — users must install it via Homebrew (macOS),
# apt-get / dnf (Linux), or the GnuWin32 build (Windows). README's
# "Distribution / licensing" section documents the install steps.
# When poppler is missing the PDF extractor degrades gracefully back
# to Tier 1 (digital-only) markdown with an ERROR log.
ocr = [
  "requests>=2.32",
  "pdf2image>=1.17",
  "pillow>=10.0",
]
# Phase G (G-02, G-03, G-06): Whisper transcription + ffmpeg.
#
# License posture: faster-whisper (MIT), imageio-ffmpeg (BSD-2-Clause)
# bundles an ffmpeg static binary (LGPL / GPL pieces of ffmpeg are not
# linked into corpus-forge — the binary is invoked as a subprocess,
# which is the documented LGPL boundary). Installing [whisper] does NOT
# widen the AGPL surface introduced by [multi-format].
#
# Both backends ship together: faster-whisper for the local path,
# requests (already in [ocr]; declared again here so the extra is
# usable standalone) for the OpenAI-compatible HTTP path.
whisper = [
  "faster-whisper>=1.0",
  "imageio-ffmpeg>=0.5",
  "requests>=2.32",
]
# Phase N Wave 3: model2vec static-embedding fast tier.
#
# License posture: model2vec is MIT (permissive).  Adding [fast-tier]
# does NOT widen the AGPL surface introduced by [multi-format] and does
# not pull a Whisper / OCR-style heavy stack — the static-tier weights
# are small (~16 MB for ``minishlab/potion-code-16M``).
#
# This is the candidate-generator front-end for ``HybridRetriever``'s
# ``SearchOptions.fast_tier_mode`` ∈ {"shortcut", "only"}; default
# "skip" leaves the embedder uninstantiated even on Wave 3 builds.
# Bench numbers + per-mode latency table live in
# ``tests/perf/out/phase_n_wave3_*.json``.
fast-tier = [
  "model2vec>=0.5",
]
# In-process llama.cpp embedder.  Pulled in to unblock
# qwen3-embedding:8b on Apple Silicon, where Ollama's OpenAI-shape
# ``/v1/embeddings`` endpoint returns HTTP 500 with
# ``failed to encode response: json: unsupported value: NaN`` for
# ~30 % of Python-code chunks (2026-05-26 incident on the maintainer's
# vault).  Running ``llama.cpp`` in-process avoids Ollama's JSON
# encoder entirely.
#
# License posture: ``llama-cpp-python`` is MIT.  Does NOT widen the
# AGPL surface introduced by ``[multi-format]``.
#
# Metal GPU offload on Apple Silicon requires building the wheel with
# ``CMAKE_ARGS="-DGGML_METAL=on" pip install 'corpus-forge[llama-cpp]'``
# — see the README's ``[llama-cpp]`` row for details.  The default
# install runs CPU-only, which is correct on Linux servers and works
# (slowly) on macOS while the user verifies the Metal build.  GGUF
# weights are NOT bundled; the resolver locates a pre-installed
# ``ollama pull <model>`` blob or an explicit ``gguf_path``.
llama-cpp = [
  "llama-cpp-python>=0.3",
]
# Phase O — EDA + corpus-cleaning ML stack.  All deps lazy-imported
# inside corpus_forge/analyze/ function bodies so corpus-forge --help
# cold-start budget is unaffected.
#
# License posture: scikit-learn (BSD-3-Clause), hdbscan (BSD-3-Clause),
# umap-learn (BSD-3-Clause), bertopic (MIT), datasketch (MIT),
# fasttext-langdetect (MIT), langdetect (Apache-2.0).  All permissive;
# does NOT widen the AGPL surface introduced by [multi-format].
analyze = [
  "scikit-learn>=1.4",
  "hdbscan>=0.8",
  "umap-learn>=0.5",
  "bertopic>=0.16",
  "datasketch>=1.6",
  # fasttext-langdetect ships a C++ extension that does not build cleanly
  # against MSVC on Windows runners; mark it Linux/macOS only and rely on
  # langdetect (pure Python) as the cross-platform fallback per
  # AnalyzeConfig.language_detector default.
  "fasttext-langdetect>=1.0; sys_platform != 'win32'",
  "langdetect>=1.0",
]

[project.scripts]
corpus-forge = "corpus_forge.cli:app"

[project.urls]
Homepage      = "https://github.com/ulmentflam/corpus-forge"
Documentation = "https://github.com/ulmentflam/corpus-forge#readme"
Repository    = "https://github.com/ulmentflam/corpus-forge"
Issues        = "https://github.com/ulmentflam/corpus-forge/issues"
Changelog     = "https://github.com/ulmentflam/corpus-forge/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.2",
  "pytest-cov>=5.0",
  "pytest-timeout>=2.3",                     # CI-1: per-test timeout (kills deadlocks)
  "pytest-randomly>=3.15",                   # CI-1: randomize order; surface order-dependence
  "pytest-xdist>=3.6",                       # CI-1: -n auto parallelism for unit suite
  "pytest-rerunfailures>=14.0",              # CI-1: targeted reruns for known-flaky network tests
  "hypothesis>=6.100",                       # fuzz / property-based tests
  "testcontainers[postgres]>=4.7",
  "ruff>=0.5",                               # lint + format
  "pyrefly>=0.1",                            # type checking (Meta)
  "pre-commit>=3.7",
  "mkdocs-material>=9.5",                    # docs site (built on demand)
  "mkdocstrings[python]>=0.25",              # API docs from docstrings
  "respx>=0.21",                             # Phase M Wave 4: httpx route mock for Zotero web client tests
  "build>=1.2",                              # CI-1: sdist/wheel builder for release artifacts
  # Phase D / Wave 3 (D-17): fixture-corpus generation script
  # (`scripts/build_fixture_corpus.py`).  These deps are needed *only*
  # to regenerate the synthetic PDFs / DOCX / PPTX / XLSX fixtures
  # under `tests/fixtures/multi_format_corpus/` from a clean checkout
  # — they are NOT part of the runtime ingest path. Kept in the `dev`
  # group so production installs (and the `[multi-format]` extra) stay
  # lean.
  "reportlab>=4.0",                          # digital-PDF synthesis
  "python-docx>=1.1",                        # .docx synthesis
  "python-pptx>=0.6",                        # .pptx synthesis
  "openpyxl>=3.1",                           # .xlsx synthesis
  "Pillow>=10.0",                            # EPUB cover + diagram bitmaps; Docling transitive but pinned for the script
]

# ── hatchling build target (explicit so the editable install picks up the
#    `corpus_forge` package even with our somewhat-noisy repo root) ──

# Phase M Wave 5 (semble investigation spike): the top-level
# ``experiments/`` directory is research-only and never ships in the
# wheel or sdist.  Because both targets are explicit allow-lists
# (``packages = ["corpus_forge"]`` below, ``include = [...]`` further
# down), ``experiments/`` is excluded *by construction* — there is no
# allow entry that would pull it in.  Mirroring the exclusion in
# ``.dockerignore`` keeps the Docker image small as well.  See
# ``experiments/README.md`` for the spike's scope rules.
[tool.hatch.build.targets.wheel]
packages = ["corpus_forge"]

# Ensure non-.py package data ships with the wheel:
#   - corpus_forge/schema/*.sql       (migration files)
#   - corpus_forge/eval/datasets/*    (bundled gold sets + provenance docs)
#   - corpus_forge/setup/questions.toml (Phase I install question tree)
#   - corpus_forge/py.typed
[tool.hatch.build.targets.wheel.force-include]
"corpus_forge/eval/datasets/forge_self.jsonl"     = "corpus_forge/eval/datasets/forge_self.jsonl"
"corpus_forge/eval/datasets/forge_self.corpus.md" = "corpus_forge/eval/datasets/forge_self.corpus.md"
"corpus_forge/setup/questions.toml"               = "corpus_forge/setup/questions.toml"
# Phase L Wave 8 — service-unit templates rendered by `corpus-forge service install`.
"corpus_forge/admin/templates/corpus-forge.service.j2" = "corpus_forge/admin/templates/corpus-forge.service.j2"
"corpus_forge/admin/templates/com.corpus-forge.plist.j2" = "corpus_forge/admin/templates/com.corpus-forge.plist.j2"

[tool.hatch.build.targets.sdist]
include = [
  "corpus_forge",
  "tests",
  "packaging",
  "scripts",
  "LICENSE",
  "README.md",
  "config.example.toml",
  "secrets.env.example",
  "Makefile",
  "pyproject.toml",
]

# ── tool config (also see Tooling & development workflow above) ──

[tool.ruff]
line-length    = 100
target-version = "py311"
# Phase D / Wave 3 (D-17): the multi-format fixture corpus is a tree
# of intentionally-trivial files in many languages (Python `hello world`,
# a Jupyter notebook with literal cell IDs, etc.) — none of them should
# be lint-checked or auto-formatted. Excluding the whole subtree keeps
# ruff focused on production code and tests.
extend-exclude = [
  "tests/fixtures/multi_format_corpus",
  # Phase M Wave 5 (semble investigation spike): research-only code,
  # excluded from wheels + Docker + lint passes.  See
  # ``experiments/README.md`` for the contract.
  "experiments",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ARG", "PTH", "RUF", "PL", "C4", "PT"]
ignore = ["PLR0911", "PLR0912", "PLR0913", "PLR0915"]

[tool.ruff.lint.per-file-ignores]
# cli.py uses intentional lazy imports inside command functions for startup speed
# and idiomatic typer.Option(...) defaults that ruff flags as B008.
"corpus_forge/cli.py" = ["PLC0415", "B008"]
# backends/conn.py defers `import psycopg` inside open_conn() so the shared
# DB-API factory stays importable on SQLite-only installs (same lazy contract
# the two CLI subgroups carried before this body was deduplicated here).
"corpus_forge/backends/conn.py" = ["PLC0415"]
# mcp/server.py defers all mcp.* imports into build_server() so the module is
# importable without the optional [mcp] extra (mirrors retrieval/rerank/*.py).
"corpus_forge/mcp/server.py" = ["PLC0415"]
# mcp/templates.py uses lazy imports to avoid circular imports with the
# corpus_forge.templates package (same pattern as mcp/server.py and cli.py).
"corpus_forge/mcp/templates.py" = ["PLC0415"]
# export.py defers optional [hf] extras (pyarrow, huggingface_hub) and
# backend construction inside functions so the module is importable without
# those extras installed.
"corpus_forge/export.py" = ["PLC0415"]
# Phase L Wave 7: admin/ modules defer `Config.load` + backend imports inside
# verb functions so the package is importable without the user's config file
# present (the verbs handle missing config individually).
"corpus_forge/admin/*.py" = ["PLC0415"]
# Phase O Wave 2: analyze/language.py — entire module contract is lazy-import.
# fasttext + langdetect MUST NOT appear in sys.modules on module load; the wave
# gate enforces this with a python -c assertion. PLC0415 suppression is
# intentional and justified by the lazy-import contract in the module docstring.
"corpus_forge/analyze/language.py" = ["PLC0415"]
# Phase O Wave 2: analyze/drift.py — scipy + numpy MUST NOT appear in
# sys.modules on module load (lazy-import contract, test-verified).
"corpus_forge/analyze/drift.py" = ["PLC0415"]
# Phase O Wave 2: analyze/dedup.py — datasketch MUST NOT appear in sys.modules
# on module load (lazy-import contract, test-verified). PLR2004 for the literal
# 2 used as the minimum-cluster-size sentinel (domain constant, not magic).
"corpus_forge/analyze/dedup.py" = ["PLC0415", "PLR2004"]
# Phase O Wave 3: analyze/topics.py — hdbscan, bertopic, umap, sklearn MUST NOT
# appear in sys.modules on module load (lazy-import contract, wave gate asserts
# this with a python -c snapshot check).
"corpus_forge/analyze/topics.py" = ["PLC0415"]
# Phase O Wave 4: _dispatch_analyze.py — all analyze imports are lazy (function
# bodies) so the MCP server does not load heavy deps on startup. PLR2004 for the
# literal 2 used as minimum-cluster sentinel. ARG001 for writes_enabled on the
# three read-only dispatch functions — the parameter is part of the uniform
# dispatch API contract; it is used by _dispatch_score_quality.
"corpus_forge/mcp/_dispatch_analyze.py" = ["PLC0415", "PLR2004", "ARG001"]
# Phase P Wave 2: retrieval/rerank/learned.py — sklearn + joblib MUST NOT appear
# in sys.modules on module load (lazy-import contract, wave gate asserts this
# with a python -c snapshot check). PLR2004 for the 0.5 neutral-score threshold
# and the literal 2 used as min-class-count sentinel (domain constants).
"corpus_forge/retrieval/rerank/learned.py" = ["PLC0415", "PLR2004"]
# Phase Q Wave 3: cli_feedback.py — Config.load + sdft.capture.record_demonstration
# are deferred inside command function bodies (PLC0415, startup-speed contract).
# ARG001 for ``fmt`` in export_session: the --format flag is part of the public
# CLI surface (tests pass --format jsonl) but only jsonl is implemented in this
# wave; the parameter is retained for future formats.
"corpus_forge/cli_feedback.py" = ["PLC0415", "ARG001"]
# eval/embedder_ranking.py — the pure ranking core (rank_embedders,
# load_candidates) must import on hosts without the ML/retrieval stack, so the
# real-wiring evaluator defers torch + retrieval imports into the function body
# (startup/optional-dep contract, same as the modules above).
"corpus_forge/eval/embedder_ranking.py" = ["PLC0415"]
# Phase P Wave 2: tester-authored test_reranker_learned.py has an I001 (import
# order) violation in TestLearnedRerankerProtocol.test_satisfies_reranker_protocol
# (``from learned import LearnedReranker`` before ``from rerank import Reranker``).
# Suppressed here; tester should fix in a follow-up.  Coder cannot modify test files.
"tests/unit/test_reranker_learned.py" = ["I001"]
# scripts/build_fixture_corpus.py emits the multilingual prose fixture family
# (prose/multilingual/*.md). The builder necessarily holds real Cyrillic / CJK /
# Arabic string literals, which RUF001 flags as "ambiguous" against Latin
# lookalikes. The emitted fixture tree is already lint-excluded (see
# [tool.ruff].extend-exclude, "intentionally-trivial files in many languages");
# this extends the same intent to the generator that produces it. RUF001 only —
# every other rule still applies to the script.
"scripts/build_fixture_corpus.py" = ["RUF001"]
# Tests use magic values, lambda args, broad raises, composite assertions freely
"tests/**/*.py" = [
    "PLR2004",  # magic-value-comparison
    "ARG005",   # unused-lambda-argument
    "ARG001",   # unused-function-argument
    "ARG002",   # unused-method-argument
    "PT011",    # pytest-raises-too-broad
    "PT018",    # pytest-composite-assertion
    "B017",     # assert-raises-exception
    "PLC0415",  # import-outside-top-level (some test fixtures use lazy imports)
]

[tool.ruff.format]
quote-style = "double"

[tool.pyrefly]
project_includes = ["corpus_forge"]
python_version   = "3.11"

[tool.pytest.ini_options]
# corpus_forge is editable-installed via hatchling so `import corpus_forge`
# resolves without sys.path gymnastics. `tests/` is NOT a package and not
# installed — `pythonpath = ["."]` restores rootdir-on-sys.path so the
# shared `tests/conftest.py` can `from tests.fuzz.profiles import ...` in
# fresh CI venvs.
pythonpath    = ["."]
testpaths     = ["tests"]
addopts       = "-ra --strict-markers --strict-config --timeout=60 --timeout-method=thread"
xfail_strict  = true
filterwarnings = [
  # Library-side runtime warnings we don't control:
  # scipy.stats.ks_2samp falls back to asymp mode for small-N samples.
  # Note: the message arg uses Python regex; the colon-after-action format
  # is "action:message:category:module" so escape inner colons.
  "ignore:.*ks_2samp.*Exact calculation unsuccessful.*:RuntimeWarning",
  # SWIG-wrapped C extensions in pymupdf/etc miss __module__ on a few
  # internal types under Python 3.13's stricter introspection.
  "ignore:builtin type Swig.*has no __module__ attribute:DeprecationWarning",
  "ignore:builtin type swigvarlink has no __module__ attribute:DeprecationWarning",
]
markers = [
  "unit: pure-unit test (no Docker, no network, no live services)",
  "integration: requires Docker / live Postgres",
  "smoke: end-to-end happy path",
  "fuzz: hypothesis-driven property tests",
  "requires_unix: marks tests that only run on POSIX platforms (Linux / macOS)",
  "requires_docker: marks tests that require a working Docker daemon",
  "requires_ollama: requires a running ollama daemon with qwen2.5vl:7b pulled",
  "requires_ollama_text: requires a running ollama daemon with a qwen2.5:*-instruct text model pulled",
  "requires_mistral_api: requires MISTRAL_API_KEY environment variable",
  "requires_whisper_local: requires faster-whisper installed AND a downloadable Whisper model on disk",
  "requires_clip_local: requires sentence-transformers + the CLIP ViT-B-32 weights pulled",
  "requires_qwen_coder: requires Ollama with a qwen-coder model pulled (qwen3.6:35b-a3b-instruct OR qwen2.5-coder:* OR qwen2.5:*-instruct)",
  "slow: slow / synthetic-scale performance benchmarks (opt-in via -m slow)",
]

[tool.coverage.run]
source = ["corpus_forge"]
omit   = [
  "corpus_forge/cli.py",
  "corpus_forge/__main__.py",
  "corpus_forge/export.py",
  # Alembic migrations are exercised by integration tests
  # (`tests/integration/test_apply_migrations_uses_alembic.py` runs
  # `alembic upgrade head` against real backends), not by unit coverage.
  # Their forward-only `pass` downgrades + early-return Postgres/SQLite
  # branches are structurally undercoverable from a single-runner suite,
  # which dragged the project total below the 90% gate after #72's
  # 0017_ingest_runs landed (76% on that file alone).
  "corpus_forge/alembic/versions/*",
]

[tool.coverage.report]
fail_under   = 85
show_missing = true

# ── Torch: CPU wheels ──────────────────────────────────────────────────
# `sentence-transformers` (a base dep) pulls `torch`/`torchvision`, which
# are declared directly above so this source override actually reaches
# them. On Linux the default PyPI wheel drags in the full CUDA stack
# (cuda-toolkit + ~18 nvidia-* wheels, multiple GB) — overkill for a CLI
# that does CPU embeddings, and far too heavy to bottle for the Homebrew
# tap. Sourcing from PyTorch's CPU index drops that stack on Linux; on
# macOS the CPU index serves the same arm64 CPU/MPS wheel PyPI would (no
# CUDA exists for macOS). There is no x86_64-macOS wheel for current
# torch, which is why the Homebrew formula targets Apple Silicon on macOS.
[tool.uv.sources]
torch       = [{ index = "pytorch-cpu" }]
torchvision = [{ index = "pytorch-cpu" }]

[[tool.uv.index]]
name     = "pytorch-cpu"
url      = "https://download.pytorch.org/whl/cpu"
explicit = true
